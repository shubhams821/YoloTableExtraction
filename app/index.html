<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Table Extraction</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1a1a1f;
    --muted: #6b6b75;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .api-config {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
  }
  header input {
    font-size: 12px;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 220px;
  }
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 57px);
  }
  .left {
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone.dragover { border-color: var(--accent); background: #f5f4ff; }
  .dropzone svg { width: 32px; height: 32px; margin-bottom: 8px; color: var(--muted); }
  .dropzone p { margin: 4px 0; font-size: 13px; color: var(--muted); }
  .dropzone strong { color: var(--text); }
  input[type=file] { display: none; }
  .file-chip {
    display: flex; align-items: center; justify-content: space-between;
    background: #f0f0f5; border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  .file-chip button {
    background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px;
  }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { background: #c7c7cf; cursor: not-allowed; }
  .toggle-row {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.error { color: #dc2626; }
  .right {
    padding: 24px;
    overflow-y: auto;
  }
  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
  }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .5; }
  .table-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .table-card-header {
    padding: 12px 16px;
    background: #fafafa;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }
  .table-card-header .meta { color: var(--muted); }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eef2ff;
    color: var(--accent);
    font-weight: 600;
    margin-left: 8px;
  }
  .table-scroll { overflow-x: auto; }
  table.data-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  table.data-table th, table.data-table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
    white-space: nowrap;
  }
  table.data-table th {
    background: #f5f5f7;
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  table.data-table tr:nth-child(even) { background: #fbfbfc; }
  .failed-note {
    padding: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid #ddd;
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>PDF Table Extraction</h1>
  <div class="api-config">
    API base:
    <input id="apiBase" type="text" value="http://localhost:8000" />
  </div>
</header>

<div class="layout">

  <div class="left">
    <div class="dropzone" id="dropzone">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
      </svg>
      <p><strong>Click to upload</strong> or drag a PDF here</p>
      <p>Single PDF file only</p>
    </div>

    <input type="file" id="fileInput" accept="application/pdf" />

    <div id="fileChip"></div>

    <div class="toggle-row">
      <input type="checkbox" id="extractToggle" checked />
      <label for="extractToggle">Extract table contents (Tabula)</label>
    </div>

    <button class="btn" id="analyzeBtn" disabled>Analyze PDF</button>

    <div class="status" id="status"></div>
  </div>

  <div class="right" id="rightPanel">
    <div class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 0 1-1.125-1.125M3.375 19.5h7.5c.621 0 1.125-.504 1.125-1.125m-9.75 0V5.625m0 12.75v-1.5c0-.621.504-1.125 1.125-1.125m18.375 2.625V5.625m0 12.75c0 .621-.504 1.125-1.125 1.125m1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125m0 3.75h-7.5A1.125 1.125 0 0 1 12 18.375M3.375 5.625c0-.621.504-1.125 1.125-1.125h17.25c.621 0 1.125.504 1.125 1.125m-19.5 0v1.5c0 .621.504 1.125 1.125 1.125m18.375-2.625v1.5c0 .621-.504 1.125-1.125 1.125m1.125-1.125h-1.5" />
      </svg>
      <p>Upload a PDF to see extracted tables here.</p>
    </div>
  </div>

</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileChip = document.getElementById('fileChip');
const analyzeBtn = document.getElementById('analyzeBtn');
const statusEl = document.getElementById('status');
const rightPanel = document.getElementById('rightPanel');
const apiBaseInput = document.getElementById('apiBase');
const extractToggle = document.getElementById('extractToggle');

let selectedFile = null;

dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    setStatus('Please select a PDF file.', true);
    return;
  }
  selectedFile = file;
  fileChip.innerHTML = '';
  const chip = document.createElement('div');
  chip.className = 'file-chip';
  chip.innerHTML = `<span>${escapeHtml(file.name)}</span>`;
  const removeBtn = document.createElement('button');
  removeBtn.textContent = 'Remove';
  removeBtn.onclick = () => {
    selectedFile = null;
    fileChip.innerHTML = '';
    analyzeBtn.disabled = true;
    fileInput.value = '';
  };
  chip.appendChild(removeBtn);
  fileChip.appendChild(chip);
  analyzeBtn.disabled = false;
  setStatus('');
}

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isError ? ' error' : '');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

analyzeBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  const apiBase = apiBaseInput.value.replace(/\/$/, '');
  const extractTables = extractToggle.checked;

  analyzeBtn.disabled = true;
  setStatus('Uploading and analyzing…');
  rightPanel.innerHTML = `<div class="empty-state"><span class="spinner"></span> Analyzing PDF…</div>`;

  try {
    const formData = new FormData();
    formData.append('file', selectedFile);

    const analyzeUrl = `${apiBase}/v1/documents/analyze?extract_tables=${extractTables}`;
    const analyzeRes = await fetch(analyzeUrl, { method: 'POST', body: formData });

    if (!analyzeRes.ok) {
      const errText = await analyzeRes.text();
      throw new Error(`Analyze failed (${analyzeRes.status}): ${errText}`);
    }

    const analyzeData = await analyzeRes.json();
    const documentId = analyzeData.document_id;
    const elementCount = analyzeData.elements.length;

    if (elementCount === 0) {
      rightPanel.innerHTML = `<div class="empty-state"><p>No tables detected in this document.</p></div>`;
      setStatus('Done. No tables found.');
      return;
    }

    if (!extractTables) {
      renderDetectionsOnly(analyzeData);
      setStatus(`Detected ${elementCount} table region(s). Enable "Extract table contents" to see actual data.`);
      return;
    }

    setStatus('Fetching extracted table data…');
    const listRes = await fetch(`${apiBase}/v1/documents/${documentId}/tables`);
    if (!listRes.ok) throw new Error(`Could not list tables (${listRes.status})`);
    const listData = await listRes.json();

    rightPanel.innerHTML = '';
    for (const t of listData.tables) {
      const card = document.createElement('div');
      card.className = 'table-card';

      const header = document.createElement('div');
      header.className = 'table-card-header';
      header.innerHTML = `
        <span>Page ${t.page} · Table ${t.table_index}
          <span class="badge">${(t.confidence * 100).toFixed(1)}% conf</span>
        </span>
        <span class="meta">${t.rows} rows × ${t.columns} cols</span>
      `;
      card.appendChild(header);

      if (!t.extracted) {
        const note = document.createElement('div');
        note.className = 'failed-note';
        note.textContent = 'Table region was detected but extraction failed for this one.';
        card.appendChild(note);
      } else {
        const tableRes = await fetch(`${apiBase}/v1/documents/${documentId}/tables/${t.table_index}`);
        const rows = await tableRes.json();
        card.appendChild(renderTable(rows));
      }

      rightPanel.appendChild(card);
    }

    setStatus(`Done. Found ${listData.tables.length} table(s).`);

  } catch (err) {
    console.error(err);
    setStatus(err.message || 'Something went wrong.', true);
    rightPanel.innerHTML = `<div class="empty-state"><p>${escapeHtml(err.message || 'Request failed.')}</p></div>`;
  } finally {
    analyzeBtn.disabled = false;
  }
});

function renderTable(rows) {
  const wrap = document.createElement('div');
  wrap.className = 'table-scroll';

  if (!rows || rows.length === 0) {
    wrap.innerHTML = `<div class="failed-note">No rows returned.</div>`;
    return wrap;
  }

  const columns = Object.keys(rows[0]);
  const table = document.createElement('table');
  table.className = 'data-table';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  columns.forEach(col => {
    const th = document.createElement('th');
    th.textContent = col;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    columns.forEach(col => {
      const td = document.createElement('td');
      td.textContent = row[col] ?? '';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  wrap.appendChild(table);
  return wrap;
}

function renderDetectionsOnly(analyzeData) {
  rightPanel.innerHTML = '';
  analyzeData.elements.forEach((el, i) => {
    const card = document.createElement('div');
    card.className = 'table-card';
    card.innerHTML = `
      <div class="table-card-header">
        <span>Table region ${i + 1}
          <span class="badge">${(el.confidence * 100).toFixed(1)}% conf</span>
        </span>
        <span class="meta">bbox: [${el.bbox.map(v => v.toFixed(1)).join(', ')}]</span>
      </div>
      <div class="failed-note">Content not extracted — enable "Extract table contents" and re-run to see rows.</div>
    `;
    rightPanel.appendChild(card);
  });
}
</script>

</body>
</html>
